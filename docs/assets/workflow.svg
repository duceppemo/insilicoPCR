<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR workflow</title>
  <desc id="desc">Primers, FASTA assemblies, and FASTQ reads flow into BLAST primer matching (reads are baited and assembled first), then hit filtering, amplicon calling, and outputs: an HTML report, the consolidated report.tsv, and a synthetic gel image.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M1 1.2 L9.5 5.5 L1 9.8 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .sub{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .small{font:13.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .num{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .edge{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0F766E}
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:1.4}
      .blue{fill:#E0F2FE;stroke:#38BDF8}
      .green{fill:#DCFCE7;stroke:#22C55E}
      .amber{fill:#FEF3C7;stroke:#F59E0B}
      .rose{fill:#FCE7F3;stroke:#F472B6}
      .ink{stroke:#0F766E;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1180" height="600" rx="28" fill="#F8FAFC"/>
  <text x="590" y="54" text-anchor="middle" class="title">How insilicoPCR works</text>
  <text x="590" y="85" text-anchor="middle" class="sub">Assemblies are BLASTed directly; reads are baited and assembled first. Hits are filtered, then paired into realistic amplicons.</text>

  <g text-anchor="middle">
    <!-- column 1: inputs, stacked -->
    <g filter="url(#shadow)">
      <rect x="50" y="130" width="220" height="100" rx="20" class="blue"/>
      <circle cx="160" cy="130" r="17" fill="#0EA5E9"/>
      <text x="160" y="137" class="num">1</text>
      <text x="160" y="172" class="label">Primer FASTA</text>
      <text x="160" y="196" class="small">-F / -R / optional -P probe</text>
      <text x="160" y="215" class="small">degenerate bases expanded</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="50" y="280" width="220" height="100" rx="20" class="green"/>
      <circle cx="160" cy="280" r="17" fill="#22C55E"/>
      <text x="160" y="287" class="num">2</text>
      <text x="160" y="322" class="label">Assemblies</text>
      <text x="160" y="346" class="small">FASTA genomes / contigs</text>
      <text x="160" y="365" class="small">searched directly</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="50" y="430" width="220" height="100" rx="20" class="green"/>
      <circle cx="160" cy="430" r="17" fill="#14B8A6"/>
      <text x="160" y="437" class="num">3</text>
      <text x="160" y="472" class="label">Raw reads</text>
      <text x="160" y="496" class="small">FASTQ, single or paired</text>
      <text x="160" y="515" class="small">gzip supported</text>
    </g>

    <!-- column 2: read prep below, BLAST in main row -->
    <g filter="url(#shadow)">
      <rect x="330" y="430" width="240" height="100" rx="20" class="card"/>
      <circle cx="450" cy="430" r="17" fill="#64748B"/>
      <text x="450" y="437" class="num">4</text>
      <text x="450" y="472" class="label">Bait &amp; assemble</text>
      <text x="450" y="496" class="small">BBDuk read baiting (2 rounds)</text>
      <text x="450" y="515" class="small">Tadpole micro-assembly</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="330" y="280" width="240" height="100" rx="20" class="blue"/>
      <circle cx="450" cy="280" r="17" fill="#0284C7"/>
      <text x="450" y="287" class="num">5</text>
      <text x="450" y="322" class="label">BLAST+ matching</text>
      <text x="450" y="346" class="small">blastn-short vs primer database</text>
      <text x="450" y="365" class="small">per-sample hit tables (TSV)</text>
    </g>

    <!-- columns 3-4: analysis chain in the main row -->
    <g filter="url(#shadow)">
      <rect x="630" y="280" width="220" height="100" rx="20" class="amber"/>
      <circle cx="740" cy="280" r="17" fill="#F59E0B"/>
      <text x="740" y="287" class="num">6</text>
      <text x="740" y="322" class="label">Hit filtering</text>
      <text x="740" y="346" class="small">mismatch + indel budget</text>
      <text x="740" y="365" class="small">weighted 3'-end check</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="910" y="280" width="220" height="100" rx="20" class="amber"/>
      <circle cx="1020" cy="280" r="17" fill="#D97706"/>
      <text x="1020" y="287" class="num">7</text>
      <text x="1020" y="322" class="label">Amplicon calling</text>
      <text x="1020" y="346" class="small">convergent F/R orientation</text>
      <text x="1020" y="365" class="small">size limits, probe in product</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="910" y="430" width="220" height="100" rx="20" class="rose"/>
      <circle cx="1020" cy="430" r="17" fill="#DB2777"/>
      <text x="1020" y="437" class="num">8</text>
      <text x="1020" y="472" class="label">Outputs</text>
      <text x="1020" y="496" class="small">HTML report, report.tsv</text>
      <text x="1020" y="515" class="small">synthetic gel image</text>
    </g>

    <!-- edges: straight, grid-aligned -->
    <path d="M270 180 L390 180 L390 274" class="ink" marker-end="url(#arrow)"/>
    <line x1="270" y1="330" x2="324" y2="330" class="ink" marker-end="url(#arrow)"/>
    <line x1="270" y1="480" x2="324" y2="480" class="ink" marker-end="url(#arrow)"/>
    <line x1="510" y1="430" x2="510" y2="386" class="ink" marker-end="url(#arrow)"/>
    <text x="566" y="412" class="edge">assembly</text>
    <line x1="570" y1="330" x2="624" y2="330" class="ink" marker-end="url(#arrow)"/>
    <line x1="850" y1="330" x2="904" y2="330" class="ink" marker-end="url(#arrow)"/>
    <line x1="1020" y1="380" x2="1020" y2="407" class="ink" marker-end="url(#arrow)"/>
  </g>
</svg>
