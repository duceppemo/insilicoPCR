<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR release pipeline</title>
  <desc id="desc">GitHub Actions release pipeline from push through validation, Maven build, runtime staging, portable ZIP creation, and GitHub release.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#0284C7"/></marker>
  </defs>
  <rect width="1100" height="470" rx="28" fill="#F8FAFC"/>
  <text x="550" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Portable Release Pipeline</text>
  <text x="550" y="91" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Deterministic builds for Windows and Linux ZIP distributions</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="44" y="170" width="150" height="92" rx="20" fill="#E0F2FE" stroke="#38BDF8"/>
      <text x="119" y="207" font-size="20" font-weight="800" fill="#075985">Push / Tag</text>
      <text x="119" y="234" font-size="14" fill="#475569">GitHub</text>
    </g>
    <line x1="194" y1="216" x2="260" y2="216" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="278" y="170" width="150" height="92" rx="20" fill="#DBEAFE" stroke="#60A5FA"/>
      <text x="353" y="207" font-size="20" font-weight="800" fill="#1D4ED8">Actions</text>
      <text x="353" y="234" font-size="14" fill="#475569">CI/CD</text>
    </g>
    <line x1="428" y1="216" x2="494" y2="216" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="512" y="170" width="150" height="92" rx="20" fill="#DCFCE7" stroke="#22C55E"/>
      <text x="587" y="207" font-size="20" font-weight="800" fill="#166534">Validate</text>
      <text x="587" y="234" font-size="14" fill="#475569">tools + tests</text>
    </g>
    <line x1="662" y1="216" x2="728" y2="216" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="746" y="170" width="150" height="92" rx="20" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="821" y="207" font-size="20" font-weight="800" fill="#92400E">Package</text>
      <text x="821" y="234" font-size="14" fill="#475569">portable ZIP</text>
    </g>
    <line x1="896" y1="216" x2="962" y2="216" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="980" y="170" width="90" height="92" rx="20" fill="#FCE7F3" stroke="#F472B6"/>
      <text x="1025" y="207" font-size="18" font-weight="800" fill="#9D174D">Release</text>
      <text x="1025" y="234" font-size="13" fill="#475569">ZIPs</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">
    <rect x="130" y="330" width="840" height="74" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="160" y="360" font-weight="700" fill="#0F172A">Release artifact contents:</text>
    <text x="160" y="386">Application JAR • bundled JDK • JavaFX runtime • curated BBMap • curated NCBI BLAST+ • platform launchers</text>
  </g>
</svg>
