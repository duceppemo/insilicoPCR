<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR workflow</title>
  <desc id="desc">Primer FASTA and sequence inputs flow into BLAST primer matching (FASTQ reads are first baited and assembled), then hit filtering, amplicon calling, and reports.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .sub{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .small{font:13.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .num{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .tag{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#9A3412}
      .edge{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0F766E}
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:1.4}
      .blue{fill:#E0F2FE;stroke:#38BDF8}
      .green{fill:#DCFCE7;stroke:#22C55E}
      .amber{fill:#FEF3C7;stroke:#F59E0B}
      .rose{fill:#FCE7F3;stroke:#F472B6}
      .ink{stroke:#0F766E;stroke-width:3.5;fill:none}
    </style>
  </defs>

  <rect width="1180" height="580" rx="28" fill="#F8FAFC"/>
  <text x="590" y="54" text-anchor="middle" class="title">How insilicoPCR works</text>
  <text x="590" y="85" text-anchor="middle" class="sub">Assemblies are BLASTed directly; reads are baited and assembled first. Hits are filtered, then paired into realistic amplicons.</text>

  <g text-anchor="middle">
    <!-- 1: primers -->
    <g filter="url(#shadow)">
      <rect x="50" y="130" width="235" height="96" rx="20" class="blue"/>
      <circle cx="167" cy="130" r="17" fill="#0EA5E9"/>
      <text x="167" y="137" class="num">1</text>
      <text x="167" y="172" class="label">Primer FASTA</text>
      <text x="167" y="196" class="small">-F / -R / optional -P probe</text>
      <text x="167" y="214" class="small">degenerate bases expanded</text>
    </g>

    <!-- 2: sequences -->
    <g filter="url(#shadow)">
      <rect x="50" y="300" width="235" height="116" rx="20" class="green"/>
      <circle cx="167" cy="300" r="17" fill="#14B8A6"/>
      <text x="167" y="307" class="num">2</text>
      <text x="167" y="344" class="label">Input sequences</text>
      <text x="167" y="370" class="small">FASTA assemblies</text>
      <text x="167" y="390" class="small">FASTQ reads (SE / PE)</text>
    </g>

    <!-- 3: baiting (FASTQ only) -->
    <g filter="url(#shadow)">
      <rect x="340" y="320" width="240" height="116" rx="20" class="card"/>
      <circle cx="460" cy="320" r="17" fill="#64748B"/>
      <text x="460" y="327" class="num">3</text>
      <text x="460" y="364" class="label">Bait &amp; assemble</text>
      <text x="460" y="390" class="small">BBDuk read baiting (2 rounds)</text>
      <text x="460" y="410" class="small">Tadpole micro-assembly</text>
      <rect x="492" y="310" width="82" height="20" rx="10" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1"/>
      <text x="533" y="324" class="tag">FASTQ only</text>
    </g>

    <!-- 4: BLAST -->
    <g filter="url(#shadow)">
      <rect x="340" y="140" width="240" height="110" rx="20" class="blue"/>
      <circle cx="460" cy="140" r="17" fill="#0284C7"/>
      <text x="460" y="147" class="num">4</text>
      <text x="460" y="182" class="label">BLAST+ matching</text>
      <text x="460" y="208" class="small">blastn-short vs primer database</text>
      <text x="460" y="228" class="small">per-sample hit tables (TSV)</text>
    </g>

    <!-- 5: hit filtering -->
    <g filter="url(#shadow)">
      <rect x="635" y="140" width="240" height="110" rx="20" class="amber"/>
      <circle cx="755" cy="140" r="17" fill="#F59E0B"/>
      <text x="755" y="147" class="num">5</text>
      <text x="755" y="182" class="label">Hit filtering</text>
      <text x="755" y="208" class="small">mismatch + indel budget</text>
      <text x="755" y="228" class="small">weighted 3'-end check (G/C-aware)</text>
    </g>

    <!-- 6: amplicon calling -->
    <g filter="url(#shadow)">
      <rect x="930" y="140" width="215" height="110" rx="20" class="amber"/>
      <circle cx="1037" cy="140" r="17" fill="#D97706"/>
      <text x="1037" y="147" class="num">6</text>
      <text x="1037" y="182" class="label">Amplicon calling</text>
      <text x="1037" y="208" class="small">convergent F/R orientation</text>
      <text x="1037" y="228" class="small">size limits, probe in product</text>
    </g>

    <!-- 7: outputs -->
    <g filter="url(#shadow)">
      <rect x="930" y="330" width="215" height="110" rx="20" class="rose"/>
      <circle cx="1037" cy="330" r="17" fill="#DB2777"/>
      <text x="1037" y="337" class="num">7</text>
      <text x="1037" y="372" class="label">Outputs</text>
      <text x="1037" y="398" class="small">consolidated report.tsv</text>
      <text x="1037" y="418" class="small">synthetic gel viewer</text>
    </g>

    <!-- edges -->
    <path d="M285 178 L328 190" class="ink" marker-end="url(#arrow)"/>

    <path d="M285 335 C320 315 310 245 330 222" class="ink" marker-end="url(#arrow)"/>
    <text x="298" y="278" class="edge" text-anchor="middle">FASTA</text>

    <path d="M285 382 L328 382" class="ink" marker-end="url(#arrow)"/>
    <text x="306" y="370" class="edge" text-anchor="middle">FASTQ</text>

    <path d="M424 320 L424 268" class="ink" marker-end="url(#arrow)"/>
    <text x="478" y="294" class="edge" text-anchor="middle">assembly</text>

    <path d="M580 195 L623 195" class="ink" marker-end="url(#arrow)"/>
    <path d="M875 195 L918 195" class="ink" marker-end="url(#arrow)"/>
    <path d="M1037 250 L1037 304" class="ink" marker-end="url(#arrow)"/>
  </g>
</svg>
