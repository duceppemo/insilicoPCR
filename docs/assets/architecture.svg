<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR architecture</title>
  <desc id="desc">One dispatcher starts either the desktop application or the command line. Both build a PipelineConfig and run the same pipeline, whose nine steps run the bundled external tools, call the analysis core and write the reports; the run returns a RunResult that the application uses for its gel and HTML buttons. The analysis core turns BLAST hits into report rows, the report package writes report.tsv through one column list, and the gel package draws one gel model as viewer, PNG or SVG. Sample naming, the input check and the data model sit underneath; everything runs from the portable runtime shipped in the release.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M1 1.2 L9.5 5.5 L1 9.8 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .sub{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .pkg{font:600 12.5px ui-monospace,Consolas,Menlo,monospace;fill:#0F766E}
      .small{font:13.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .step{font:700 12.5px Inter,Segoe UI,Arial,sans-serif;fill:#14532D}
      .num{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .edge{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0F766E}
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:1.4}
      .blue{fill:#E0F2FE;stroke:#38BDF8}
      .green{fill:#DCFCE7;stroke:#22C55E}
      .chip{fill:#fff;stroke:#86EFAC;stroke-width:1.2}
      .amber{fill:#FEF3C7;stroke:#F59E0B}
      .rose{fill:#FCE7F3;stroke:#F472B6}
      .violet{fill:#EDE9FE;stroke:#A78BFA}
      .slate{fill:#F1F5F9;stroke:#94A3B8}
      .ink{stroke:#0F766E;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1180" height="800" rx="28" fill="#F8FAFC"/>
  <text x="590" y="54" text-anchor="middle" class="title">Application architecture</text>
  <text x="590" y="85" text-anchor="middle" class="sub">Two interfaces, one pipeline: the application and the command line run the same steps and the same analysis code.</text>

  <g text-anchor="middle">
    <!-- Row 1: interfaces -->
    <g filter="url(#shadow)">
      <rect x="50" y="125" width="280" height="110" rx="20" class="blue"/>
      <circle cx="190" cy="125" r="17" fill="#0284C7"/>
      <text x="190" y="132" class="num">2</text>
      <text x="190" y="164" class="label">Desktop application</text>
      <text x="190" y="183" class="pkg">insilicopcr</text>
      <text x="190" y="205" class="small">window, settings, run task, log.txt</text>
      <text x="190" y="223" class="small">gel and HTML of its own run</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="450" y="125" width="280" height="110" rx="20" class="blue"/>
      <circle cx="590" cy="125" r="17" fill="#0EA5E9"/>
      <text x="590" y="132" class="num">1</text>
      <text x="590" y="164" class="label">Dispatcher</text>
      <text x="590" y="183" class="pkg">dispatchpcr</text>
      <text x="590" y="205" class="small">one launcher, one JAR</text>
      <text x="590" y="223" class="small">picks the interface</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="850" y="125" width="280" height="110" rx="20" class="blue"/>
      <circle cx="990" cy="125" r="17" fill="#0284C7"/>
      <text x="990" y="132" class="num">3</text>
      <text x="990" y="164" class="label">Command line</text>
      <text x="990" y="183" class="pkg">dispatchpcr.CliConfig</text>
      <text x="990" y="205" class="small">options for every setting</text>
      <text x="990" y="223" class="small">exit 0 done, 1 failed, 2 wrong usage</text>
    </g>

    <!-- Row 2: pipeline -->
    <g filter="url(#shadow)">
      <rect x="50" y="300" width="1080" height="140" rx="20" class="green"/>
      <circle cx="590" cy="300" r="17" fill="#22C55E"/>
      <text x="590" y="307" class="num">4</text>
      <text x="590" y="340" class="label">Shared pipeline</text>
      <text x="590" y="359" class="pkg">pipeline.InSilicoPcrPipeline</text>
    </g>
    <g class="step">
      <rect x="66" y="376" width="106" height="30" rx="9" class="chip"/><text x="119" y="396">Dependencies</text>
      <rect x="180" y="376" width="106" height="30" rx="9" class="chip"/><text x="233" y="396">Primers</text>
      <rect x="294" y="376" width="106" height="30" rx="9" class="chip"/><text x="347" y="396">Input check</text>
      <rect x="408" y="376" width="106" height="30" rx="9" class="chip"/><text x="461" y="396">Reads</text>
      <rect x="522" y="376" width="136" height="30" rx="9" class="chip"/><text x="590" y="396">BLAST database</text>
      <rect x="666" y="376" width="106" height="30" rx="9" class="chip"/><text x="719" y="396">BLAST</text>
      <rect x="780" y="376" width="106" height="30" rx="9" class="chip"/><text x="833" y="396">Read search</text>
      <rect x="894" y="376" width="118" height="30" rx="9" class="chip"/><text x="953" y="396">Read extension</text>
      <rect x="1020" y="376" width="94" height="30" rx="9" class="chip"/><text x="1067" y="396">Reports</text>
    </g>
    <text x="590" y="428" class="small">each step a class, called in order from run(); FASTQ samples only for Reads, Read search and Read extension; QAlog.txt written last</text>

    <!-- Row 3: what the pipeline uses -->
    <g filter="url(#shadow)">
      <rect x="50" y="505" width="240" height="110" rx="20" class="card"/>
      <circle cx="170" cy="505" r="17" fill="#64748B"/>
      <text x="170" y="512" class="num">5</text>
      <text x="170" y="544" class="label">External tools</text>
      <text x="170" y="563" class="pkg">pipeline.ExternalProgram</text>
      <text x="170" y="585" class="small">BBDuk, Tadpole, BBMerge</text>
      <text x="170" y="603" class="small">makeblastdb, blastn</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="330" y="505" width="240" height="110" rx="20" class="amber"/>
      <circle cx="450" cy="505" r="17" fill="#F59E0B"/>
      <text x="450" y="512" class="num">6</text>
      <text x="450" y="544" class="label">Analysis core</text>
      <text x="450" y="563" class="pkg">pcr</text>
      <text x="450" y="585" class="small">hit filtering, amplicon calling</text>
      <text x="450" y="603" class="small">calls from reads, size labels</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="610" y="505" width="240" height="110" rx="20" class="rose"/>
      <circle cx="730" cy="505" r="17" fill="#DB2777"/>
      <text x="730" y="512" class="num">7</text>
      <text x="730" y="544" class="label">Reports</text>
      <text x="730" y="563" class="pkg">report</text>
      <text x="730" y="585" class="small">report.tsv (ReportColumn)</text>
      <text x="730" y="603" class="small">HTML report, FASTQ diagnostics</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="890" y="505" width="240" height="110" rx="20" class="violet"/>
      <circle cx="1010" cy="505" r="17" fill="#7C3AED"/>
      <text x="1010" y="512" class="num">8</text>
      <text x="1010" y="544" class="label">Synthetic gel</text>
      <text x="1010" y="563" class="pkg">gel.GelScene</text>
      <text x="1010" y="585" class="small">one gel model, drawn as</text>
      <text x="1010" y="603" class="small">viewer, --gel PNG, SVG</text>
    </g>

    <!-- Row 4: underneath -->
    <g filter="url(#shadow)">
      <rect x="50" y="670" width="520" height="90" rx="20" class="card"/>
      <circle cx="310" cy="670" r="17" fill="#64748B"/>
      <text x="310" y="677" class="num">9</text>
      <text x="310" y="708" class="label">Portable runtime</text>
      <text x="310" y="730" class="small">OpenJDK 26 with JavaFX, BBTools, NCBI BLAST+: nothing to install,</text>
      <text x="310" y="748" class="small">the same folder layout on Windows and Linux</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="610" y="670" width="520" height="90" rx="20" class="slate"/>
      <circle cx="870" cy="670" r="17" fill="#475569"/>
      <text x="870" y="677" class="num">10</text>
      <text x="870" y="708" class="label">Foundations</text>
      <text x="870" y="730" class="small"><tspan class="pkg">util</tspan>: names, input check · <tspan class="pkg">thermo</tspan>: Primer3 Tm</text>
      <text x="870" y="748" class="small"><tspan class="pkg">model</tspan>: Sample, BlastResult; used by every layer</text>
    </g>

    <!-- edges -->
    <line x1="450" y1="180" x2="336" y2="180" class="ink" marker-end="url(#arrow)"/>
    <text x="393" y="166" class="edge">no arguments</text>
    <line x1="730" y1="180" x2="844" y2="180" class="ink" marker-end="url(#arrow)"/>
    <text x="787" y="166" class="edge">arguments</text>

    <line x1="130" y1="235" x2="130" y2="277" class="ink" marker-end="url(#arrow)"/>
    <text x="114" y="262" class="edge" text-anchor="end">PipelineConfig</text>
    <line x1="250" y1="300" x2="250" y2="241" class="ink" marker-end="url(#arrow)"/>
    <text x="266" y="275" class="edge" text-anchor="start">RunResult</text>
    <line x1="990" y1="235" x2="990" y2="277" class="ink" marker-end="url(#arrow)"/>
    <text x="1006" y="262" class="edge" text-anchor="start">PipelineConfig</text>

    <line x1="170" y1="440" x2="170" y2="482" class="ink" marker-end="url(#arrow)"/>
    <line x1="450" y1="440" x2="450" y2="482" class="ink" marker-end="url(#arrow)"/>
    <line x1="730" y1="440" x2="730" y2="482" class="ink" marker-end="url(#arrow)"/>
    <line x1="1010" y1="440" x2="1010" y2="482" class="ink" marker-end="url(#arrow)"/>
    <text x="1026" y="466" class="edge" text-anchor="start">--gel</text>

    <line x1="291" y1="560" x2="323" y2="560" class="ink" marker-end="url(#arrow)"/>
    <line x1="571" y1="560" x2="603" y2="560" class="ink" marker-end="url(#arrow)"/>
    <line x1="851" y1="560" x2="883" y2="560" class="ink" marker-end="url(#arrow)"/>
    <text x="310" y="642" class="edge">BLAST hits</text>
    <text x="590" y="642" class="edge">ReportRow</text>
    <text x="870" y="642" class="edge">report.tsv</text>

    <line x1="110" y1="615" x2="110" y2="647" class="ink" marker-end="url(#arrow)"/>
    <text x="124" y="638" class="edge" text-anchor="start">run from</text>
  </g>
</svg>
