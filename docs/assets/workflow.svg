<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR scientific workflow</title>
  <desc id="desc">Primer input flows through BBMap, amplicon detection, BLAST validation, quality assessment, and report generation.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="28" fill="#F8FAFC"/>
  <text x="550" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Scientific Workflow</text>
  <text x="550" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">From primer input to publication-ready reports</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    <g transform="translate(64 190)" filter="url(#shadow)">
      <rect width="150" height="110" rx="22" fill="url(#card)" stroke="#BAE6FD"/>
      <circle cx="75" cy="38" r="21" fill="#38BDF8" opacity="0.9"/>
      <text x="75" y="46" font-size="22" font-weight="800" fill="#fff">1</text>
      <text x="75" y="82" font-weight="700" fill="#0F172A">Primers</text>
    </g>
    <line x1="232" y1="245" x2="323" y2="245" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(340 190)" filter="url(#shadow)">
      <rect width="150" height="110" rx="22" fill="url(#card)" stroke="#A7F3D0"/>
      <circle cx="75" cy="38" r="21" fill="#14B8A6" opacity="0.9"/>
      <text x="75" y="46" font-size="22" font-weight="800" fill="#fff">2</text>
      <text x="75" y="76" font-weight="700" fill="#0F172A">BBMap</text>
      <text x="75" y="99" font-size="14" fill="#475569">candidate search</text>
    </g>
    <line x1="508" y1="245" x2="599" y2="245" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(616 190)" filter="url(#shadow)">
      <rect width="150" height="110" rx="22" fill="url(#card)" stroke="#BAE6FD"/>
      <circle cx="75" cy="38" r="21" fill="#0EA5E9" opacity="0.9"/>
      <text x="75" y="46" font-size="22" font-weight="800" fill="#fff">3</text>
      <text x="75" y="76" font-weight="700" fill="#0F172A">Amplicons</text>
      <text x="75" y="99" font-size="14" fill="#475569">detect &amp; size</text>
    </g>
    <line x1="784" y1="245" x2="875" y2="245" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(892 190)" filter="url(#shadow)">
      <rect width="150" height="110" rx="22" fill="url(#card)" stroke="#A7F3D0"/>
      <circle cx="75" cy="38" r="21" fill="#0F766E" opacity="0.9"/>
      <text x="75" y="46" font-size="22" font-weight="800" fill="#fff">4</text>
      <text x="75" y="76" font-weight="700" fill="#0F172A">BLAST+</text>
      <text x="75" y="99" font-size="14" fill="#475569">validation</text>
    </g>

    <path d="M967 300 C967 382 826 388 826 412" fill="none" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(616 392)" filter="url(#shadow)">
      <rect width="210" height="110" rx="22" fill="url(#card)" stroke="#BAE6FD"/>
      <circle cx="105" cy="38" r="21" fill="#0284C7" opacity="0.9"/>
      <text x="105" y="46" font-size="22" font-weight="800" fill="#fff">5</text>
      <text x="105" y="76" font-weight="700" fill="#0F172A">Quality Assessment</text>
      <text x="105" y="99" font-size="14" fill="#475569">primer and hit summaries</text>
    </g>
    <line x1="616" y1="447" x2="510" y2="447" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(270 392)" filter="url(#shadow)">
      <rect width="220" height="110" rx="22" fill="url(#card)" stroke="#A7F3D0"/>
      <circle cx="110" cy="38" r="21" fill="#059669" opacity="0.9"/>
      <text x="110" y="46" font-size="22" font-weight="800" fill="#fff">6</text>
      <text x="110" y="76" font-weight="700" fill="#0F172A">Excel Reports</text>
      <text x="110" y="99" font-size="14" fill="#475569">detailed and consolidated</text>
    </g>
  </g>
</svg>
