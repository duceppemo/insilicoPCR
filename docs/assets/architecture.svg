<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR application architecture</title>
  <desc id="desc">Layered architecture showing JavaFX GUI, services, tool runners, parsers, model, and report writers.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#F8FAFC"/>
  <text x="550" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Application Architecture</text>
  <text x="550" y="91" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Clean separation between UI, domain services, external tools, and reports</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="410" y="125" width="280" height="72" rx="20" fill="#E0F2FE" stroke="#38BDF8"/>
      <text x="550" y="168" font-size="22" font-weight="800" fill="#075985">JavaFX GUI</text>
    </g>
    <line x1="550" y1="197" x2="550" y2="244" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="370" y="250" width="360" height="82" rx="20" fill="#DCFCE7" stroke="#22C55E"/>
      <text x="550" y="284" font-size="22" font-weight="800" fill="#166534">Application Services</text>
      <text x="550" y="309" font-size="14" fill="#475569">PrimerService • workflow orchestration • validation</text>
    </g>

    <line x1="452" y1="332" x2="315" y2="392" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="550" y1="332" x2="550" y2="392" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="648" y1="332" x2="785" y2="392" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="160" y="400" width="250" height="82" rx="20" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="285" y="434" font-size="21" font-weight="800" fill="#0F172A">External Tools</text>
      <text x="285" y="459" font-size="14" fill="#475569">BBMap • BLAST+ runners</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="425" y="400" width="250" height="82" rx="20" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="550" y="434" font-size="21" font-weight="800" fill="#0F172A">Domain Model</text>
      <text x="550" y="459" font-size="14" fill="#475569">samples • primers • hits • paths</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="690" y="400" width="250" height="82" rx="20" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="815" y="434" font-size="21" font-weight="800" fill="#0F172A">Parsers</text>
      <text x="815" y="459" font-size="14" fill="#475569">BLAST output • mapping results</text>
    </g>

    <line x1="550" y1="482" x2="550" y2="525" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="365" y="530" width="370" height="62" rx="20" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="550" y="568" font-size="22" font-weight="800" fill="#92400E">Report Writers</text>
    </g>
  </g>
</svg>
