      <rect x="116" y="294" width="122" height="38" rx="19" fill="#14B8A6"/>
      <text x="144" y="319" fill="#062F2B">Portable</text>
      <rect x="252" y="294" width="154" height="38" rx="19" fill="#38BDF8"/>
      <text x="281" y="319" fill="#082F49">Cross-platform</text>
      <rect x="420" y="294" width="142" height="38" rx="19" fill="#A7F3D0"/>
      <text x="448" y="319" fill="#064E3B">Open source</text>
    </g>
  </g>

  <g transform="translate(907 128)" filter="url(#shadow)">
