<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR workflow</title>
  <desc id="desc">Primer FASTA and sequence inputs flow into BLAST primer matching (FASTQ reads are first baited and assembled), then hit filtering, amplicon calling, and reports.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto">
      <path d="M1 1.2 L9.5 5.5 L1 9.8 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .sub{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}
      .small{font:13.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .num{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .tag{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#9A3412}
      .edge{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0F766E}
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:1.4}
      .blue{fill:#E0F2FE;stroke:#38BDF8}
      .green{fill:#DCFCE7;stroke:#22C55E}
      .amber{fill:#FEF3C7;stroke:#F59E0B}
      .rose{fill:#FCE7F3;stroke:#F472B6}
      .ink{stroke:#0F766E;stroke-width:3.5;fill:none;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1180" height="540" rx="28" fill="#F8FAFC"/>
  <text x="590" y="54" text-anchor="middle" class="title">How insilicoPCR works</text>
  <text x="590" y="85" text-anchor="middle" class="sub">Assemblies are BLASTed directly; reads are baited and assembled first. Hits are filtered, then paired into realistic amplicons.</text>

  <g text-anchor="middle">
    <!-- top row: y=140, h=110 -->
    <!-- 1: primers -->
    <g filter="url(#shadow)">
      <rect x="50" y="140" width="235" height="110" rx="20" class="blue"/>
      <circle cx="167" cy="140" r="17" fill="#0EA5E9"/>
      <text x="167" y="147" class="num">1</text>
      <text x="167" y="182" class="label">Primer FASTA</text>
      <text x="167" y="208" class="small">-F / -R / optional -P probe</text>
      <text x="167" y="228" class="small">degenerate bases expanded</text>
    </g>

    <!-- 4: BLAST -->
    <g filter="url(#shadow)">
      <rect x="340" y="140" width="240" height="110" rx="20" class="blue"/>
      <circle cx="460" cy="140" r="17" fill="#0284C7"/>
      <text x="460" y="147" class="num">4</text>
      <text x="460" y="182" class="label">BLAST+ matching</text>
      <text x="460" y="208" class="small">blastn-short vs primer database</text>
      <text x="460" y="228" class="small">per-sample hit tables (TSV)</text>
    </g>

    <!-- 5: hit filtering -->
    <g filter="url(#shadow)">
      <rect x="635" y="140" width="240" height="110" rx="20" class="amber"/>
      <circle cx="755" cy="140" r="17" fill="#F59E0B"/>
      <text x="755" y="147" class="num">5</text>
      <text x="755" y="182" class="label">Hit filtering</text>
      <text x="755" y="208" class="small">mismatch + indel budget</text>
      <text x="755" y="228" class="small">weighted 3'-end check (G/C-aware)</text>
    </g>

    <!-- 6: amplicon calling -->
    <g filter="url(#shadow)">
      <rect x="930" y="140" width="215" height="110" rx="20" class="amber"/>
      <circle cx="1037" cy="140" r="17" fill="#D97706"/>
      <text x="1037" y="147" class="num">6</text>
      <text x="1037" y="182" class="label">Amplicon calling</text>
      <text x="1037" y="208" class="small">convergent F/R orientation</text>
      <text x="1037" y="228" class="small">size limits, probe in product</text>
    </g>

    <!-- bottom row: y=330, h=110 -->
    <!-- 2: sequences -->
    <g filter="url(#shadow)">
      <rect x="50" y="330" width="235" height="110" rx="20" class="green"/>
      <circle cx="167" cy="330" r="17" fill="#14B8A6"/>
      <text x="167" y="337" class="num">2</text>
      <text x="167" y="372" class="label">Input sequences</text>
      <text x="167" y="398" class="small">FASTA assemblies</text>
      <text x="167" y="418" class="small">FASTQ reads (SE / PE)</text>
    </g>

    <!-- 3: baiting (FASTQ only) -->
    <g filter="url(#shadow)">
      <rect x="340" y="330" width="240" height="110" rx="20" class="card"/>
      <circle cx="460" cy="330" r="17" fill="#64748B"/>
      <text x="460" y="337" class="num">3</text>
      <text x="460" y="372" class="label">Bait &amp; assemble</text>
      <text x="460" y="398" class="small">BBDuk read baiting (2 rounds)</text>
      <text x="460" y="418" class="small">Tadpole micro-assembly</text>
      <rect x="492" y="320" width="82" height="20" rx="10" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1"/>
      <text x="533" y="334" class="tag">FASTQ only</text>
    </g>

    <!-- 7: outputs -->
    <g filter="url(#shadow)">
      <rect x="930" y="330" width="215" height="110" rx="20" class="rose"/>
      <circle cx="1037" cy="330" r="17" fill="#DB2777"/>
      <text x="1037" y="337" class="num">7</text>
      <text x="1037" y="372" class="label">Outputs</text>
      <text x="1037" y="398" class="small">consolidated report.tsv</text>
      <text x="1037" y="418" class="small">synthetic gel viewer</text>
    </g>

    <!-- edges: straight lines only, labels offset from the lines -->
    <line x1="285" y1="195" x2="331" y2="195" class="ink" marker-end="url(#arrow)"/>
    <line x1="580" y1="195" x2="626" y2="195" class="ink" marker-end="url(#arrow)"/>
    <line x1="875" y1="195" x2="921" y2="195" class="ink" marker-end="url(#arrow)"/>

    <!-- FASTA assemblies go straight to BLAST -->
    <line x1="285" y1="355" x2="406" y2="257" class="ink" marker-end="url(#arrow)"/>
    <text x="303" y="318" class="edge">FASTA</text>

    <!-- FASTQ reads go to baiting/assembly -->
    <line x1="285" y1="392" x2="331" y2="392" class="ink" marker-end="url(#arrow)"/>
    <text x="308" y="412" class="edge">FASTQ</text>

    <!-- assembled contigs go to BLAST -->
    <line x1="424" y1="326" x2="424" y2="257" class="ink" marker-end="url(#arrow)"/>
    <text x="470" y="296" class="edge">assembly</text>

    <!-- called amplicons go to outputs -->
    <line x1="1037" y1="250" x2="1037" y2="306" class="ink" marker-end="url(#arrow)"/>
  </g>
</svg>
