name: CI and portable releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  # Monthly, on master as it stands: whether the build still passes on the newest runner images,
  # Java 25 update and Actions, and on the newest tools Bioconda users get (job newest-tools).
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the ZIPs are named for; blank: the version in pom.xml'
        required: false
        default: ''

# Read only: a pull request's code runs here. The release job alone may write (its own permissions).
permissions:
  contents: read

jobs:
  linux-zip:
    name: Linux portable ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          # The newest Java 25 update, which the ZIPs bundle, not one the runner image holds.
          check-latest: true
          cache: maven

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          # A tag names its release; a manual run may name its build; otherwise the ZIPs carry the
          # version in pom.xml, which the program reports.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source runtime layout
        shell: bash
        run: |
          chmod +x scripts/dev/verify-runtime-layout.sh
          scripts/dev/verify-runtime-layout.sh

      - name: Run unit tests with coverage
        shell: bash
        run: |
          chmod +x mvnw
          # A virtual display, so the tests that draw the gel (JavaFX) run instead of being skipped.
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a ./mvnw --batch-mode test
          else
            ./mvnw --batch-mode test
          fi
          test -f target/site/jacoco/jacoco.xml || { echo "JaCoCo report missing"; exit 1; }

      - name: Require the tests that need BLAST+, Chrome or a display to have run
        shell: bash
        run: |
          chmod +x scripts/ci/require-tests-ran.sh
          scripts/ci/require-tests-ran.sh target/surefire-reports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Build Linux portable ZIP
        shell: bash
        env:
          DO_INSTALLER: 'false'
        run: |
          chmod +x mvnw
          chmod +x scripts/release/package-linux-portable.sh
          scripts/release/package-linux-portable.sh "${{ steps.version.outputs.value }}"

      - name: Validate bundled runtime tools
        shell: bash
        run: |
          REQUIRE_BINARIES=true scripts/dev/verify-runtime-layout.sh

      - name: Smoke test the Linux ZIP
        shell: bash
        run: |
          chmod +x scripts/ci/smoke-test.sh
          scripts/ci/smoke-test.sh release/*linux-x64.zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: insilicoPCR-linux-x64
          path: |
            release/*linux-x64.zip
            release/*linux-x64.zip.sha256
          if-no-files-found: error

      - name: Build the ZIP without a runtime
        shell: bash
        run: |
          # For package managers (the Bioconda package) and containers: the program and its
          # libraries, from the build above, without the bundled Java, BLAST+ and BBTools.
          chmod +x scripts/release/package-no-runtime.sh
          scripts/release/package-no-runtime.sh "${{ steps.version.outputs.value }}"

      - name: Upload the ZIP without a runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: insilicoPCR-linux-x64-no-runtime
          path: |
            release/*linux-x64-no-runtime.zip
            release/*linux-x64-no-runtime.zip.sha256
          if-no-files-found: error

  conda-check:
    name: ZIP without a runtime, on conda's tools
    # The ZIP the Bioconda package is made from, run as a conda installation runs it: Java, BLAST+
    # and BBTools from conda-forge and Bioconda (BBTools' classes in a folder, not a jar), found on PATH.
    needs: [ linux-zip ]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the ZIP without a runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: insilicoPCR-linux-x64-no-runtime
          path: build

      - name: Install Miniforge
        # The runner image's Miniconda is not set up on ubuntu-latest ($CONDA is empty there).
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: false

      - name: Install Java 25, BLAST+ and BBTools from conda-forge and Bioconda
        shell: bash
        run: |
          # The versions the portable ZIP bundles, so that a change in conda's packages does not
          # fail a build; the Bioconda recipe takes later ones too.
          "${CONDA:?setup-miniconda sets CONDA}/bin/conda" create --yes --quiet --prefix "$RUNNER_TEMP/env" --override-channels \
            -c conda-forge -c bioconda 'openjdk=25' 'blast=2.17.0' 'bbmap=40.05'

      - name: Smoke test with conda's tools
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/env/bin:$PATH" JAVA_HOME="$RUNNER_TEMP/env/lib/jvm"
          java -version
          scripts/ci/smoke-test.sh build/*linux-x64-no-runtime.zip

  newest-tools:
    name: Newest tools, and updates to bundle
    # Monthly and manual runs only. conda-check pins the bundled versions, so that a pull request
    # does not fail for a change elsewhere; this job takes the newest versions the Bioconda recipe
    # allows (Java 25 or later, BLAST+ 2.17.0 or later, BBTools 40.x), as a new conda installation
    # does, so that a break reaches us before users. It then compares what the latest release bundles
    # with the newest Java 25 update, BLAST+ and BBTools, and opens an issue for those that are newer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [ linux-zip ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the ZIP without a runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: insilicoPCR-linux-x64-no-runtime
          path: build

      - name: Install Miniforge
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: false

      - name: Install the newest Java, BLAST+ and BBTools the Bioconda recipe allows
        shell: bash
        run: |
          "${CONDA:?setup-miniconda sets CONDA}/bin/conda" create --yes --quiet --prefix "$RUNNER_TEMP/env" --override-channels \
            -c conda-forge -c bioconda 'openjdk>=25' 'blast>=2.17.0' 'bbmap>=40.04,<41'

      - name: Smoke test with them
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/env/bin:$PATH" JAVA_HOME="$RUNNER_TEMP/env/lib/jvm"
          { java -version 2>&1 | head -n 1; blastn -version | head -n 1
            bbduk.sh --version 2>&1 | grep -o 'BBTools version [0-9.]*' | head -n 1; } | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci/smoke-test.sh build/*linux-x64-no-runtime.zip

      - name: Open an issue for newer versions to bundle
        # Also when the smoke test failed: the two are independent.
        if: success() || failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CONDA_EXE="${CONDA:?setup-miniconda sets CONDA}/bin/conda"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          python3 -I scripts/ci/remote-zip-entry.py \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/insilicoPCR-${tag#v}-linux-x64.zip" \
            VERSIONS.txt > "$RUNNER_TEMP/VERSIONS.txt"
          scripts/ci/newer-versions.sh "$RUNNER_TEMP/VERSIONS.txt" > "$RUNNER_TEMP/newer.txt"
          if [[ ! -s "$RUNNER_TEMP/newer.txt" ]]; then
            echo "$tag bundles the newest Java 25 update, BLAST+ and BBTools." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One issue per set of versions: a later run finds it, open or closed, and opens no other.
          title="Newer versions to bundle: $(cut -d' ' -f1,2 "$RUNNER_TEMP/newer.txt" | paste -sd, - | sed 's/,/, /g')"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" \
               --json title --jq '.[].title' | grep -qxF -- "$title"; then
            echo "Already reported: $title" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Newer versions of what the portable ZIPs of $tag bundle:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/newer.txt"
            echo
            echo "A release built now bundles the newest Java 25 update by itself (setup-java with check-latest)."
            echo "BLAST+ and BBTools are the copies committed under runtime/ (Git LFS), replaced by hand."
            echo "This run (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) tested the"
            echo "ZIP without a runtime on the newest versions the Bioconda recipe allows."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          echo "Opened: $title" >> "$GITHUB_STEP_SUMMARY"

  windows-zip:
    name: Windows portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          # The newest Java 25 update, which the ZIPs bundle, not one the runner image holds.
          check-latest: true
          cache: maven

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          # As in the Linux job: the tag, a manual run's version, or the version in pom.xml.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "value=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.version }}') {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=$(([xml](Get-Content pom.xml)).project.version)" >> $env:GITHUB_OUTPUT
          }

      - name: Validate source runtime layout
        shell: bash
        run: |
          chmod +x scripts/dev/verify-runtime-layout.sh
          scripts/dev/verify-runtime-layout.sh

      - name: Run unit tests
        shell: pwsh
        run: |
          # Paths, line ends and file names behave otherwise on Windows: the tests run there too.
          # Coverage is uploaded from the Linux job.
          .\mvnw.cmd -B test "-Djacoco.skip=true"

      - name: Require that the tests ran
        shell: bash
        run: |
          # As on Linux: a build that skipped them (a -DskipTests left in, a filter matching none) fails.
          scripts/ci/require-tests-ran.sh --windows target/surefire-reports

      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          .\scripts\release-windows.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Validate bundled runtime tools
        shell: bash
        run: |
          REQUIRE_BINARIES=true scripts/dev/verify-runtime-layout.sh

      - name: Smoke test the Windows ZIP
        shell: bash
        run: |
          scripts/ci/smoke-test.sh release/*windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: insilicoPCR-windows-x64
          path: |
            release/*windows-x64.zip
            release/*windows-x64.zip.sha256
          if-no-files-found: error

  windows-harness:
    name: Windows test harness
    # The Windows ZIP of this build, through the situations a Windows user meets (install and data
    # folders with spaces, accents and symbols, long paths, files from Windows tools, reruns, two runs
    # into one folder, a run killed from Task Manager): scripts/wintest/run-windows-tests.ps1.
    needs: [ windows-zip ]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the Windows ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: insilicoPCR-windows-x64
          path: build

      - name: Run the harness (Windows PowerShell)
        shell: powershell
        run: |
          $zip = (Get-ChildItem build -Filter '*windows-x64.zip' | Select-Object -First 1).FullName
          .\scripts\wintest\run-windows-tests.ps1 -Zip $zip
          exit $LASTEXITCODE

      - name: Show the cases that did not pass
        if: always()
        shell: powershell
        run: |
          $r = 'scripts\wintest\results'
          if (-not (Test-Path "$r\summary.tsv")) { exit 0 }
          Get-Content "$r\environment.txt"
          Write-Host '===== summary ====='
          Get-Content "$r\summary.tsv"
          foreach ($row in Import-Csv -Delimiter "`t" "$r\summary.tsv") {
            if ($row.status -in 'FAIL', 'INFO') {
              $d = Join-Path $r $row.case
              if (Test-Path $d) {
                Write-Host "===== $($row.case) [$($row.status)] ====="
                Get-ChildItem $d -File | ForEach-Object {
                  Write-Host "--- $($_.Name)"
                  Get-Content $_.FullName -TotalCount 120
                }
              }
            }
          }

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wintest-results
          path: scripts/wintest/results
          if-no-files-found: ignore

  publish-github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux-zip, conda-check, windows-zip, windows-harness ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # The ZIPs, not the harness results.
          pattern: insilicoPCR-*
          path: dist
          merge-multiple: true

      - name: Show files
        shell: bash
        run: find dist -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          sparse-checkout: docs/release-notes

      - name: Release notes of this version
        shell: bash
        run: |
          # The curated notes of the version, if any, above the list of pull requests GitHub writes.
          notes="source/docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [[ -f "$notes" ]]; then cp "$notes" release-notes.md; else : > release-notes.md; fi

      - name: Publish the ZIPs only
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*linux-x64.zip
            dist/*linux-x64.zip.sha256
            dist/*linux-x64-no-runtime.zip
            dist/*linux-x64-no-runtime.zip.sha256
            dist/*windows-x64.zip
            dist/*windows-x64.zip.sha256
          body_path: release-notes.md
          generate_release_notes: true
