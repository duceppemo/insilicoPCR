<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1024 1024"
   role="img"
   aria-labelledby="title desc"
   version="1.1"
   id="svg15"
   sodipodi:docname="insilicoPCR-icon.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview15"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1"
     inkscape:cx="392.5"
     inkscape:cy="549"
     inkscape:window-width="1798"
     inkscape:window-height="1214"
     inkscape:window-x="527"
     inkscape:window-y="117"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg15" />
  <title
     id="title">insilicoPCR app icon</title>
  <desc
     id="desc">A blue PCR tube partially filled with liquid, with one continuous green DNA helix halfway inside the tube and halfway outside.</desc>
  <defs
     id="defs2">
    <style
       id="style1">
      .blue { stroke:#1E88E5; }
      .green { stroke:#43A047; }
      .liquid { fill:#B3D7F7; opacity:.82; }
      .white { fill:#fff; }
      .tube-fill { fill:#fff; opacity:.92; }
      .line { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <clipPath
       id="tubeClip">
      <path
         d="M342 368 L342 590 C342 690 404 804 512 884 C620 804 682 690 682 590 L682 368 Z"
         id="path1" />
    </clipPath>
    <clipPath
       id="liquidClip">
      <path
         d="M342 368 L342 590 C342 690 404 804 512 884 C620 804 682 690 682 590 L682 368 Z"
         id="path2" />
    </clipPath>
  </defs>
  <rect
     width="1024"
     height="1024"
     rx="220"
     class="white"
     id="rect2"
     style="stroke-width:0.1;stroke-dasharray:none" />
  <!-- PCR tube body fill -->
  <path
     d="M342 368 L342 590 C342 690 404 804 512 884 C620 804 682 690 682 590 L682 368 Z"
     class="tube-fill"
     id="path3" />
  <!-- Liquid, clipped to tube interior -->
  <g
     clip-path="url(#liquidClip)"
     id="g4"
     transform="translate(-2,39)">
    <path
       d="m 351,618 c 66,-22 118,16 177,-6 61,-23 101,0 141,-16 V 881 H 341 Z"
       class="liquid"
       id="path4" />
  </g>
  <!-- Single continuous DNA helix: top half outside, bottom half inside tube; bottom touches liquid surface -->
  <g
     id="g28"
     transform="matrix(1.3730992,0,0,2.1293035,327.47944,-147.78337)">
    <path
       d="m 54.06772,129.33634 c 0,110 160,110 160,220"
       id="path5"
       style="fill:none;stroke:#43a047;stroke-width:36;stroke-linecap:round;stroke-linejoin:round"
       sodipodi:nodetypes="cc" />
    <path
       d="m 214.06772,129.33634 c 0,110 -160,110 -160,220"
       id="path6"
       inkscape:label="path6"
       style="fill:none;stroke:#43a047;stroke-width:36;stroke-linecap:round;stroke-linejoin:round"
       sodipodi:nodetypes="cc" />
  </g>
  <!-- DNA rungs -->
  <g
     class="line green"
     stroke-width="28"
     id="g10"
     transform="matrix(0.95915908,0,0,1.3516087,20.754802,-88.140531)">
    <path
       d="m 464,160 h 96"
       id="path7" />
    <path
       d="m 470,244 h 84"
       id="path8" />
    <path
       d="m 470,420 h 84"
       id="path9" />
    <path
       d="m 464,512 h 96"
       id="path10" />
  </g>
  <!-- Inner portion fade mask simulated with tube-wall overlay: transparent tube remains readable -->
  <g
     clip-path="url(#tubeClip)"
     opacity=".18"
     id="g11">
    <rect
       x="330"
       y="360"
       width="364"
       height="276"
       fill="#fff"
       id="rect10" />
  </g>
  <!-- Tube outline -->
  <path
     d="m 342,368 1,270 c 0.37037,99.99931 86,281 166,287 77,-2 174.36363,-182.00066 174,-282 l -1,-275 z"
     class="line blue"
     stroke-width="36"
     id="path11"
     sodipodi:nodetypes="cscscc" />
  <!-- Tube rim/cap drawn over helix at midpoint -->
  <rect
     x="258"
     y="280.08127"
     width="508"
     height="88"
     rx="38"
     class="white blue"
     stroke-width="36"
     id="rect11" />
  <!-- Measurement ticks -->
  <g
     class="line blue"
     stroke-width="32"
     id="g15">
    <path
       d="M610 470 H672"
       id="path12" />
    <path
       d="M610 542 H672"
       id="path13" />
    <path
       d="M610 614 H672"
       id="path14" />
    <path
       d="M610 686 H650"
       id="path15" />
  </g>
  <path
     style="fill:#000000;stroke:#000000;stroke-width:0.1;stroke-dasharray:none"
     d="M 21.714758,239.33376 H 244.4135"
     id="path16" />
</svg>
