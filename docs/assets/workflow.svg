<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR scientific workflow</title>
  <desc id="desc">Primers and FASTA or FASTQ inputs flow through BBMap candidate search, amplicon detection, BLAST validation, reports, and synthetic gel visualization.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.sub{font:17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.label{font:800 20px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.small{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.num{font:800 20px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.4}.blue{fill:#E0F2FE;stroke:#38BDF8}.green{fill:#DCFCE7;stroke:#22C55E}.amber{fill:#FEF3C7;stroke:#F59E0B}.rose{fill:#FCE7F3;stroke:#F472B6}.ink{stroke:#0F766E;stroke-width:4;fill:none}
    </style>
  </defs>

  <rect width="1100" height="620" rx="28" fill="#F8FAFC"/>
  <text x="550" y="58" text-anchor="middle" class="title">Scientific Workflow</text>
  <text x="550" y="91" text-anchor="middle" class="sub">FASTA assemblies and FASTQ reads processed through the same PCR analysis pipeline</text>

  <g text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="70" y="150" width="210" height="92" rx="20" class="blue"/>
      <circle cx="105" cy="186" r="22" fill="#0EA5E9"/>
      <text x="105" y="193" class="num">1</text>
      <text x="180" y="184" class="label">Primer FASTA</text>
      <text x="180" y="210" class="small">-F / -R / optional -P</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="320" width="210" height="118" rx="20" class="green"/>
      <circle cx="105" cy="360" r="22" fill="#14B8A6"/>
      <text x="105" y="367" class="num">2</text>
      <text x="180" y="354" class="label">Input Sequences</text>
      <text x="180" y="382" class="small">FASTA assemblies</text>
      <text x="180" y="404" class="small">FASTQ reads</text>
    </g>

    <path d="M280 196 C338 196 338 276 392 276" class="ink" marker-end="url(#arrow)"/>
    <path d="M280 379 C338 379 338 276 392 276" class="ink" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="410" y="220" width="220" height="112" rx="22" class="card"/>
      <circle cx="452" cy="260" r="22" fill="#0F766E"/>
      <text x="452" y="267" class="num">3</text>
      <text x="520" y="254" class="label">BBMap Search</text>
      <text x="520" y="282" class="small">candidate primer hits</text>
      <text x="520" y="304" class="small">mismatch-tolerant matching</text>
    </g>

    <line x1="630" y1="276" x2="704" y2="276" class="ink" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="720" y="220" width="220" height="112" rx="22" class="amber"/>
      <circle cx="762" cy="260" r="22" fill="#F59E0B"/>
      <text x="762" y="267" class="num">4</text>
      <text x="830" y="254" class="label">Amplicons</text>
      <text x="830" y="282" class="small">detect pairs</text>
      <text x="830" y="304" class="small">size products</text>
    </g>

    <path d="M830 332 C830 385 730 392 690 430" class="ink" marker-end="url(#arrow)"/>
    <path d="M940 276 C1000 276 1012 350 970 408" class="ink" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="570" y="430" width="220" height="112" rx="22" class="blue"/>
      <circle cx="612" cy="470" r="22" fill="#0284C7"/>
      <text x="612" y="477" class="num">5</text>
      <text x="680" y="464" class="label">BLAST+</text>
      <text x="680" y="492" class="small">sequence validation</text>
      <text x="680" y="514" class="small">contig-level confirmation</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="830" y="430" width="220" height="112" rx="22" class="rose"/>
      <circle cx="872" cy="470" r="22" fill="#DB2777"/>
      <text x="872" y="477" class="num">6</text>
      <text x="940" y="464" class="label">Outputs</text>
      <text x="940" y="492" class="small">reports + Excel</text>
      <text x="940" y="514" class="small">synthetic gel viewer</text>
    </g>

    <line x1="790" y1="486" x2="814" y2="486" class="ink" marker-end="url(#arrow)"/>
  </g>
</svg>
