<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR release pipeline</title>
  <desc id="desc">Deterministic GitHub Actions release pipeline validating committed runtime assets, building with Maven, staging bundled JDK and tools, and publishing portable ZIP archives.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#0284C7"/></marker>
    <style>
      .title{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.sub{font:17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.label{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.small{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.blue{fill:#E0F2FE;stroke:#38BDF8}.green{fill:#DCFCE7;stroke:#22C55E}.amber{fill:#FEF3C7;stroke:#F59E0B}.rose{fill:#FCE7F3;stroke:#F472B6}.violet{fill:#EDE9FE;stroke:#8B5CF6}.line{stroke:#0284C7;stroke-width:4;fill:none}
    </style>
  </defs>

  <rect width="1100" height="500" rx="28" fill="#F8FAFC"/>
  <text x="550" y="58" text-anchor="middle" class="title">Portable Release Pipeline</text>
  <text x="550" y="91" text-anchor="middle" class="sub">Deterministic Windows and Linux ZIP releases without downloading BBMap or BLAST+ during CI</text>

  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="50" y="170" width="145" height="92" rx="20" class="blue"/>
    <text x="122.5" y="207" class="label">Tag</text>
    <text x="122.5" y="234" class="small">v* release</text>

    <rect x="250" y="170" width="145" height="92" rx="20" class="violet"/>
    <text x="322.5" y="207" class="label">Validate</text>
    <text x="322.5" y="234" class="small">runtime assets</text>

    <rect x="450" y="170" width="145" height="92" rx="20" class="green"/>
    <text x="522.5" y="207" class="label">Build</text>
    <text x="522.5" y="234" class="small">Maven + tests</text>

    <rect x="650" y="170" width="145" height="92" rx="20" class="amber"/>
    <text x="722.5" y="207" class="label">Stage</text>
    <text x="722.5" y="234" class="small">JDK + tools</text>

    <rect x="850" y="170" width="200" height="92" rx="20" class="rose"/>
    <text x="950" y="207" class="label">Publish ZIPs</text>
    <text x="950" y="234" class="small">Linux + Windows + SHA256</text>
  </g>

  <line x1="195" y1="216" x2="232" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="395" y1="216" x2="432" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="595" y1="216" x2="632" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="795" y1="216" x2="832" y2="216" class="line" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">
    <rect x="120" y="330" width="860" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="150" y="361" font-weight="800" fill="#0F172A">Portable release contents</text>
    <text x="150" y="388">Application JAR • dependency libraries • bundled OpenJDK 26 • JavaFX runtime • curated BBMap • curated NCBI BLAST+ • run-insilicoPCR launchers</text>
  </g>
</svg>
