    <text x="112" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">insilicoPCR</text>
    <text x="116" y="202" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="500" fill="#D1FAE5">Modern in silico PCR analysis for genome assemblies</text>
    <text x="116" y="257" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#BAE6FD">Java 26 • JavaFX 26 • BBMap • BLAST+ • Windows • Linux</text>
