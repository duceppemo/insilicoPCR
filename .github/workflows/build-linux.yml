name: build-linux.yml

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x build.sh || true
          chmod +x run.sh || true
          chmod +x mvnw || true

      - name: Build with bundled JDK if available
        run: |
          if [ -x "./build.sh" ]; then
            ./build.sh
          else
            ./mvnw -B clean package
          fi

      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: insilicoPCR-linux-build
          path: |
            target/*.jar
            target/*.zip
            target/*.tar.gz
