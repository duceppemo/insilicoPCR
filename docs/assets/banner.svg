<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">insilicoPCR project banner</title>
  <desc id="desc">Modern cross-platform in silico PCR analysis for genome assemblies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="52%" stop-color="#12324A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="32" fill="url(#grid)"/>

  <g opacity="0.22" stroke="#A7F3D0" stroke-width="5" fill="none">
    <path d="M818 84 C895 42 978 42 1055 84 C1132 126 1132 182 1055 224 C978 266 895 266 818 224"/>
    <path d="M818 224 C895 182 978 182 1055 224 C1132 266 1132 322 1055 364 C978 406 895 406 818 364"/>
    <path d="M860 65 L1020 384"/>
    <path d="M1016 65 L856 384"/>
  </g>

  <g filter="url(#shadow)">
